# ============================================
# Mailman Docker Compose
# For local development and GCP Cloud Run testing
# ============================================

services:
  mailman:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    image: mailman-server
    container_name: mailman
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
      - DATABASE_PATH=/app/data/webmail.db
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production-use-a-long-random-string}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef}
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - MICROSOFT_CLIENT_ID=${MICROSOFT_CLIENT_ID:-}
      - MICROSOFT_CLIENT_SECRET=${MICROSOFT_CLIENT_SECRET:-}
      - PLUGINS_DIR=/app/plugins
      - TEMPLATES_DIR=/app/data/templates
      - AUDIT_LOG_DIR=/app/data/logs
      # Spam filter config
      - SPAM_BLOCKED_DOMAINS=${SPAM_BLOCKED_DOMAINS:-}
      - SPAM_BLOCKED_KEYWORDS=${SPAM_BLOCKED_KEYWORDS:-}
    volumes:
      # Persist SQLite database across restarts
      - mailman-data:/app/data
      # Mount external plugins directory
      - ./plugins:/app/plugins:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 512m
    cpus: 1.5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  mailman-data:
    driver: local

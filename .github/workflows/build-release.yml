name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ─── Web Client + Server Build ───
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build --workspace=client
      - run: npm run build --workspace=server
      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: |
            client/dist/
            server/dist/

  # ─── Windows EXE (Electron) ───
  build-exe:
    runs-on: windows-latest
    needs: build-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build --workspace=client
      - working-directory: electron
        run: |
          npm install
          npx electron-builder --win --x64
      - uses: actions/upload-artifact@v4
        with:
          name: mailman-windows
          path: electron/dist/*.exe

  # ─── Android APK (Capacitor) ───
  build-apk:
    runs-on: ubuntu-latest
    needs: build-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"
      - run: npm ci
      - run: npm run build --workspace=client
      - run: npx cap sync android
      - working-directory: android
        run: ./gradlew assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: mailman-android
          path: android/app/build/outputs/apk/release/*.apk

  # ─── Docker Image ───
  build-docker:
    runs-on: ubuntu-latest
    needs: build-web
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: mailman:${{ github.ref_name || 'latest' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Create GitHub Release ───
  release:
    runs-on: ubuntu-latest
    needs: [build-exe, build-apk]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/mailman-windows/*.exe
            artifacts/mailman-android/*.apk
          generate_release_notes: true

</ARG>
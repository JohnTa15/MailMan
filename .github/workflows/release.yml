name: Build and Release

# Every push to main publishes a new release: the patch version goes up by
# one from the latest v* tag (or to the version in package.json, if that is
# higher). Pushing a v* tag or running this manually with a tag also works.
on:
  push:
    branches: [main]
    tags:
      - 'v*'
    # Documentation-only changes don't need a new release (not applied to tags)
    paths-ignore:
      - '**.md'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create from the selected branch (e.g. v1.2.0). Leave empty to only build.'
        required: false
        default: ''

# One release at a time, in push order
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Determine version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Compute version
        id: v
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          release=true
          if [ "$REF_TYPE" = "tag" ]; then
            tag="$REF_NAME"
          elif [ "$EVENT" = "workflow_dispatch" ] && [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
          else
            latest=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)
            latest=${latest:-v0.0.0}
            IFS=. read -r major minor patch <<< "${latest#v}"
            next="$major.$minor.$((patch + 1))"
            pkg=$(node -p "require('./package.json').version")
            # A manual bump in package.json (e.g. to 2.0.0) wins when higher
            if [ "$(printf '%s\n%s\n' "$next" "$pkg" | sort -V | tail -n1)" = "$pkg" ] && [ "$pkg" != "${latest#v}" ]; then
              next="$pkg"
            fi
            tag="v$next"
            # A manual run without a tag only builds
            [ "$EVENT" = "workflow_dispatch" ] && release=false
          fi
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag '$tag' must look like v1.2.3"
            exit 1
          fi
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "Version: ${tag#v} (release: $release)" >> "$GITHUB_STEP_SUMMARY"

  build-windows:
    name: Build Windows (.exe)
    needs: version
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Set Version
        run: node scripts/set-version.mjs ${{ needs.version.outputs.version }}

      - name: Build Client
        run: npm run build --workspace=client

      - name: Package Electron App (.exe)
        # Publishing is handled by the release job below
        run: npm run package --workspace=electron -- --win --publish never

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: electron/dist/*.exe
          if-no-files-found: error

  build-android:
    name: Build Android (.apk)
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies
        run: npm ci

      - name: Set Version
        run: node scripts/set-version.mjs ${{ needs.version.outputs.version }}

      - name: Build Client
        run: npm run build --workspace=client

      - name: Sync Capacitor Android
        run: |
          npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [version, build-windows, build-android]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4

      - name: Display structure of downloaded files
        run: ls -R

      - name: Create Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            windows-installer/*.exe
            android-apk/**/*.apk
          # Creates the tag at the built commit when it doesn't exist yet
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
